services:
  gateway:
    build:
      context: ./hpn_nginx_gateway
    container_name: hpn_nginx_gateway
    environment:
      BACKEND_UPSTREAM_URL: ${BACKEND_UPSTREAM_URL:-http://hpnmobilebackend.railway.internal:4000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:80"
    restart: unless-stopped
